<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline editorial do Bora Radar</title>
  <desc id="desc">Diagrama em cinco etapas: fontes da semana, pesquisa e síntese no Gemini, curadoria humana, roteiro e vozes no NotebookLM e publicação multimídia.</desc>
  <rect width="1200" height="560" rx="28" fill="#2439a8"/>
  <text x="60" y="76" fill="#d9ff59" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">BORA / RADAR · PIPELINE EDITORIAL</text>
  <text x="60" y="132" fill="#fffef9" font-family="Georgia, serif" font-size="50">Uma fonte, cinco movimentos.</text>
  <text x="60" y="168" fill="#fffef9" opacity=".76" font-family="Arial, sans-serif" font-size="18">A automação reduzia o trabalho repetitivo; a curadoria continuava decidindo o que publicar.</text>

  <g aria-label="Etapas do pipeline">
    <g transform="translate(48 220)">
