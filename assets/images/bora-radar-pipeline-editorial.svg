      <text x="22" y="91" fill="#171713" font-family="Arial, sans-serif" font-size="22" font-weight="700">Fontes</text>
      <text x="22" y="122" fill="#65645e" font-family="Arial, sans-serif" font-size="15">TLDR · HN · GitHub</text>
      <text x="22" y="147" fill="#65645e" font-family="Arial, sans-serif" font-size="15">podcasts e anúncios</text>
      <text x="22" y="181" fill="#2439a8" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ENTRADA</text>
    </g>

    <path d="M252 323h36" fill="none" stroke="#d9ff59" stroke-width="4"/>
    <path d="m280 312 14 11-14 11" fill="none" stroke="#d9ff59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(294 220)">
      <rect width="194" height="206" rx="18" fill="#d9ff59"/>
      <circle cx="32" cy="34" r="20" fill="#2439a8"/>
